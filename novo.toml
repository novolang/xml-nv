[package]
name        = "xml-nv"
version     = "0.1.0"
description = "XML 1.0 without a DTD: a pull parser whose events are byte ranges into the caller's own string, a tolerant tree built from those same events with namespace prefixes already resolved, ElementTree's find and findall as named walks rather than an XPath subset, and a writer that escapes into a caller's buffer and refuses to emit what it cannot escape."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: a scan over a string the caller already holds, an arena of
# indices, and a writer that appends to the caller's buffer.  No
# function declares an effect.  A DTD's external subset is never
# fetched, and an `<?xml encoding=?>` other than UTF-8 is refused rather
# than transcoded, so nothing here reads anything.
#
# There is no `tests/embedded_probe.nv`: the tree is an allocation per
# document and the scanner takes a `Str`, and neither is what a
# microcontroller has.
layer       = "core"

category    = "data"

tags        = ["xml", "parser", "pull-parser", "sax", "elementtree", "namespaces", "streaming", "sans-io"]
repository  = "https://github.com/novolang/xml-nv"
maintainers = ["novo-lang"]
# 0.13.0 is the first toolchain on which `break` inside a match arm on
# a `Result` releases the arm's payload, which the tree builder does.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Reading XML without reading a DTD"

[dependencies]
# None.  unicode-nv is not here: XML 1.0's Name and Char productions are
# lists of code point ranges (sections 2.2 and 2.3), and XML compares
# names by code point, so nothing asks Unicode a question about case,
# width or normalisation.  html-nv is not here either: HTML5's tokenizer
# and XML's share no states worth sharing.
